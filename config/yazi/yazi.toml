# ==============================================================================
# YAZI FILE MANAGER CONFIGURATION
# Location: ~/.config/yazi/yazi.toml
# ==============================================================================

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size   = 2
max_width  = 1000
max_height = 1000
