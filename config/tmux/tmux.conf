# ==============================================================================
# TMUX CONFIGURATION (TokyoNight theme, Neovim & Ghostty optimized)
# Location: ~/.tmux.conf  ->  symlink to config-settings/config/tmux/tmux.conf
# ==============================================================================

# --- General & Terminal compatibility -----------------------------------------
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%dm'

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10          # fast Escape for Neovim
set -g focus-events on          # pass focus events to Neovim
set -g set-clipboard on         # OSC 52 clipboard integration

# --- Numbering (start windows & panes at 1) -----------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings --------------------------------------------------------------
# Reload configuration with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Intuitive splits preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Appearance (TokyoNight Night palette) ------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] "
set -g status-right "#[fg=#565f89]%Y-%m-%d #[fg=#c0caf5,bold]%H:%M #[fg=#15161e,bg=#bb9af7,bold] #h "

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7dcfff,bg=#292e42,bold] #I:#W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
